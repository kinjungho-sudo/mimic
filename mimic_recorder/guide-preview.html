<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Parro 미리보기</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      padding: 18px;
      background: #0B1020;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    h1 {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button {
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 9px;
      background: rgba(255, 255, 255, .08);
      color: #fff;
      cursor: pointer;
    }
    main {
      display: grid;
      flex: 1;
      min-height: 0;
      place-items: center;
    }
    img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 84px);
      border-radius: 12px;
      background: #050507;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
      object-fit: contain;
    }
    #error {
      display: none;
      max-width: 420px;
      color: #FCA5A5;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="previewTitle">Parro 미리보기</h1>
    <button id="closePreview" type="button">닫기</button>
  </header>
  <main>
    <img id="previewImage" alt="">
    <p id="error">미리보기를 불러오지 못했습니다.</p>
  </main>
  <script src="i18n.js"></script>
  <script src="guide-preview.js"></script>
</body>
</html>
