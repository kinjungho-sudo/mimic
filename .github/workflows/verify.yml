name: verify

# Runs the same local checks required before merging (mimic_app/docs/DEV_PROCESS.md).
# Production build and Vercel deploys stay on Vercel; this job does not deploy.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # Windows matches the Desktop and Recorder scripts that verify:quality calls.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mimic_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mimic_app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Contract tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit -p .
